spring.application.name=agrichat_service
server.port=${SERVER_PORT:8081}

# Local quick-start SQL database. Data persists to ./data/agrichat in the project.
spring.datasource.url=${DB_URL:jdbc:h2:file:./data/agrichat;MODE=MySQL;AUTO_SERVER=TRUE}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=${DB_DRIVER:org.h2.Driver}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.h2.console.enabled=${H2_CONSOLE_ENABLED:true}
spring.h2.console.path=/h2-console

# Teammate's AGRI-KNOWLEDGE-SERVICE base URL; service endpoint is POST /api/knowledge/retrieve
agrisaarthi.knowledge-service-url=${KNOWLEDGE_SERVICE_URL:http://localhost:8082}

# Optional Gemini integration. Never commit a real key to Git.
agrisaarthi.ai.api-key=${GEMINI_API_KEY:}
agrisaarthi.ai.model=${GEMINI_MODEL:gemini-2.5-flash}

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when_authorized
springdoc.swagger-ui.path=/swagger-ui.html

# Permit the local frontend during development. Override FRONTEND_ORIGIN for your teammate's URL.
agrisaarthi.frontend-origin=${FRONTEND_ORIGIN:http://localhost:3000}
