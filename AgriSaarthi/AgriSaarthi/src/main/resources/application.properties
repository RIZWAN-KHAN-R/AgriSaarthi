spring.application.name=agri-knowledge-service
server.port=${SERVER_PORT:8082}
knowledge.documents.pattern=classpath*:knowledge/*.txt
knowledge.retrieval.minimum-score=${KNOWLEDGE_MINIMUM_SCORE:2}
weather.api.url=${WEATHER_API_URL:https://api.open-meteo.com/v1/forecast}
spring.mvc.problemdetails.enabled=true
spring.threads.virtual.enabled=false
