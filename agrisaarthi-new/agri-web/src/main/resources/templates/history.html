
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conversation History | AgriSaarthi</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <div class="app-layout">
        <aside class="sidebar">
            <a href="/" class="brand">
                <span class="brand-icon">A</span>
                <span>AgriSaarthi</span>
            </a>

            <a href="/" class="new-chat">+ New conversation</a>

            <div class="sidebar-section">
                <p class="section-label">MENU</p>
                <a href="/" class="nav-link">Chat assistant</a>
                <a href="/history" class="nav-link active">
                    Conversation history
                </a>
            </div>
        </aside>

        <main class="main-content">
            <header class="topbar">
                <div>
                    <p class="eyebrow">YOUR ACTIVITY</p>
                    <h1>Conversation history</h1>
                </div>
            </header>

            <section class="chat-section">
                <h2>Previous conversations</h2>
                <p>
                    Your saved conversations will appear here when
                    conversation-history support is connected to the backend.
                </p>

                <a href="/" class="new-chat">Return to chat</a>
            </section>
        </main>
    </div>
</body>
</html>
